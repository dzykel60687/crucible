[package]
name = "crucible-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Crucible's window: a Tauri 2 shell around the engine. The UI only sends commands (D-022)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = { workspace = true }
anyhow = { workspace = true }
crucible-diagnostics = { workspace = true }
crucible-engine = { path = "../../crates/crucible-engine" }
# Only for a scan's child process, which asks one plugin what it is (D-044).
crucible-plugin-host = { path = "../../crates/crucible-plugin-host" }
# The system's own folder picker for Browse (D-042). MIT. On Windows it is the Explorer dialog;
# its default features only add the Linux back ends.
rfd = "0.18"
# The main window's native handle, so plugins' windows can float above it (D-044). MIT or
# Apache-2.0; Tauri already uses it.
raw-window-handle = "0.6"
