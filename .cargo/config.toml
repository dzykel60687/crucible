# PLATFORM: Windows (MSVC toolchain) only. Statically link the C runtime so the test
# programs can be copied to another Windows PC without installing the Visual C++
# redistributable. Has no effect on macOS or Linux builds.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
