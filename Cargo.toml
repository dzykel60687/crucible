[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
midir = "0.11"
vst3-host = { version = "0.11", default-features = false }
dirs = "6"
wasapi = "0.27"
log = "0.4"
daw-diagnostics = { path = "crates/daw-diagnostics" }

# Release builds keep line tables in the separate .pdb (Windows) so crash and panic stacks in
# logs name source lines. The .exe size is unaffected on Windows.
[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
